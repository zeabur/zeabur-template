# yaml-language-server: $schema=https://schema.zeabur.app/template.json
apiVersion: zeabur.com/v1
kind: Template
metadata:
    name: Paperclip
spec:
    description: |
        An orchestration platform for coordinating multiple AI agents to run autonomous businesses. Manages agent teams, assigns goals, tracks work, and monitors costs from a central dashboard.
    coverImage: https://raw.githubusercontent.com/paperclipai/paperclip/master/doc/assets/header.png
    icon: https://raw.githubusercontent.com/paperclipai/paperclip/master/ui/public/android-chrome-192x192.png
    variables:
        - key: PUBLIC_DOMAIN
          type: DOMAIN
          name: Domain
          description: The domain to access Paperclip dashboard
    tags:
        - AI
        - Agent
    readme: |
        # Paperclip

        > **Beta:** Paperclip is in early development. This template and the software may have unexpected issues.

        [Paperclip](https://github.com/paperclipai/paperclip) is an orchestration platform for coordinating multiple AI agents (Claude, Codex, Cursor, OpenClaw, etc.) to run autonomous businesses. It provides a Node.js server with a React UI that manages agent teams, assigns goals, tracks work, and monitors costs from a central dashboard.

        ## Getting Started

        1. Deploy the template and wait for the service to start.
        2. Open the Paperclip domain from the Zeabur **Networking** tab.
        3. Click **Sign in / Create account**, then sign up with your email and password. The first user to sign up automatically becomes the instance admin.
        4. After setup, set `PAPERCLIP_AUTH_DISABLE_SIGN_UP` to `true` in Zeabur environment variables to prevent unauthorized signups.
        5. Configure AI agent authentication (see **AI Agent Authentication** below).
        6. When creating an agent, set **Working directory** to a path under `/paperclip/` (e.g. `/paperclip/workspaces/my-project`).
        7. Click **Test now** to run the adapter environment check. A successful result shows `hello probe succeeded`.

        > **Alternative:** You can also create the first admin via the Zeabur Terminal: `gosu node pnpm paperclipai auth bootstrap-ceo`

        ## AI Agent Authentication

        **Option 1: Environment variables (recommended)**

        Set these in Zeabur environment variables:

        | Tool | Environment Variable |
        |------|---------------------|
        | Claude Code | `ANTHROPIC_API_KEY` |
        | Codex | `OPENAI_API_KEY` |

        **Option 2: Terminal login**

        Open the Zeabur Terminal and run:

        | Tool | Terminal Login |
        |------|----------------|
        | Claude Code | `gosu node claude login` |
        | Codex | `gosu node codex login --device-auth` |

        ### Notes

        - **Always use `gosu node` prefix** when running CLI tools in Terminal. The terminal runs as root, but credentials must be stored under the `node` user's home (`/paperclip/`) to persist and be accessible by the server.
        - **Codex device auth:** Enable "Enable device code authorization for Codex" in [ChatGPT Security Settings](https://chatgpt.com/settings/security) before running the login command.

        ## Important Notes

        - **Persistent storage:** Only data under `/paperclip/` survives restarts. All other paths are ephemeral.
        - **Working directory:** Do not use `/app` — it contains the Paperclip source code and will be overwritten on updates. Always use paths under `/paperclip/` which is persistent.
        - **Sign-up control:** Set `PAPERCLIP_AUTH_DISABLE_SIGN_UP` to `true` after creating your admin account. Temporarily set to `false` when you need to invite new users, then set back to `true`.

        ## Changelog

        ### 2026-06-05 — v2026.529.0

        - Updated image to upstream release `v2026.529.0` (`ghcr.io/paperclipai/paperclip:sha-911a1e8`)
        - Simplified startup: init.sh now delegates to the image's native `docker-entrypoint.sh`
        - New: **Browser-based first-admin claim** — no terminal needed to set up the first admin account
        - New: Inline document annotations and revision-aware comment threads
        - New: Company skills CLI and catalog management (install, audit, export, assign)
        - New: Hide projects and agents from sidebar (user-scoped resource membership)
        - New: Live Claude model discovery — new Anthropic models appear without a code release
        - New: Grok Build as a first-class local runtime adapter
        - New: Modal sandbox provider plugin (alongside E2B, Cloudflare, Daytona)
        - New: Workspace diff viewer plugin (split/unified panes, staged/unstaged changes)
        - New: Routine secrets with `agent < project < routine` precedence
        - New: Local Cloud Upstream sync flow
        - New: Source-scoped recovery actions for stalled work
        - New: Blocked Inbox attention view for triaging stalled tasks
        - New: Local plugin development workflow with `paperclipai plugin init`
        - New: Document locking for safer agent handoffs
        - New: i18n foundation (i18next, locale validation, supported locale resources)
        - Improved: ACPX-Claude adapter works out of the box (bare model IDs, better diagnostics)
        - Improved: Scoped agent permissions and assignment controls
        - Improved: Kanban scaling with compact cards, collapsed cold lanes, per-column limits
        - Improved: Pause/resume agents from sidebar, virtualized chat threads
        - Improved: Productivity review surfaces stalled work automatically
        - Improved: Tighter workspace lifecycle guarantees (finalize gates, no-remote-git enforcement)
        - Improved: Accepted plans can no longer be decomposed more than once

        ### 2026-04-22 — v2026.416.0

        - Updated image to upstream release `v2026.416.0` (`ghcr.io/paperclipai/paperclip:sha-b8725c5`)
        - New: External adapter plugin system with dynamic UI parsers and declarative config schemas
        - New: Issue hierarchy display with collapse/expand, sub-task counts, and persisted state
        - New: Feedback voting and thumbs-capture flow for evals
        - New: Execution workspaces with runtime controls and per-project workspace tab
        - New: Workspace-aware routine runs
        - Improved: Inbox mail-client keyboard shortcuts and "Today" divider
        - Improved: Mobile layouts, dark mode, and adapter override UI
        - Security: `BETTER_AUTH_SECRET` and `PAPERCLIP_AGENT_JWT_SECRET` are now strictly required at startup (template already sets these)

        ### 2026-04-07 — v2026.403.0

        - Updated image to upstream release `v2026.403.0` (`ghcr.io/paperclipai/paperclip:sha-a072377`)
        - Switched from Docker Hub (`zeabur/paperclip`) to upstream GitHub Container Registry (`ghcr.io/paperclipai/paperclip`)
        - Changed persistent volume path from `/home/node/` to `/paperclip/`
        - Switched CLI command prefix from `runuser -u node --` to `gosu node`
        - New: First-class blocker/dependency relations with wake-on-subtasks-done
        - Improved: Bearer token redaction in server logs
        - Improved: CEO agent onboarding with relative paths
        - Improved: Markdown paste auto-formatting in inline editor
        - Many bug fixes for UI routing, sidebar, worktree, and agent workflows

        ### 2026-03-30 — v2026.325.0

        - Updated image to upstream release `v2026.325.0` (652 commits since v0.3.1)
        - New: Inbox "Mine" tab with archive flow
        - New: Hermes adapter support
        - New: Cost control plane with billing, quota, and budget management
        - New: Plugin SDK with document CRUD and event bus
        - New: Worktree support for isolated agent workspaces
        - New: Company import/export with org chart SVG
        - Improved: Agent detail tabs reorganized (Prompts, Skills, Instructions)
        - Improved: Embedded Postgres reliability in Docker
        - Many bug fixes for adapters (Codex, Pi, OpenCode, Cursor)

        ### 2026-03-16 — Initial Release

        - Zeabur template for Paperclip AI agent orchestration platform
        - Services: PostgreSQL 17 + Paperclip (prebuilt image `zeabur/paperclip`, amd64 + arm64)
        - Startup script auto-generates `config.json` on first boot
        - Server runs as `node` user via `runuser` (required for Claude Code CLI)
        - Single persistent volume at `/home/node/`
        - Pre-installed CLI tools: `claude-code`, `codex`, `opencode-ai`

        ## Links

        - [Documentation](https://docs.paperclip.ing/start/what-is-paperclip)
        - [GitHub](https://github.com/paperclipai/paperclip)
    services:
        - name: postgresql
          icon: https://cdn.zeabur.com/marketplace/postgresql.svg
          template: PREBUILT_V2
          spec:
            id: postgresql
            source:
                image: postgres:17-alpine
            ports:
                - id: database
                  port: 5432
                  type: TCP
            volumes:
                - id: data
                  dir: /var/lib/postgresql/data
            env:
                POSTGRES_CONNECTION_STRING:
                    default: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
                    expose: true
                POSTGRES_DB:
                    default: paperclip
                POSTGRES_HOST:
                    default: ${CONTAINER_HOSTNAME}
                    expose: true
                POSTGRES_PASSWORD:
                    default: ${PASSWORD}
                    expose: true
                POSTGRES_PORT:
                    default: ${DATABASE_PORT}
                    expose: true
                POSTGRES_USER:
                    default: paperclip
        - name: paperclip
          icon: https://raw.githubusercontent.com/paperclipai/paperclip/master/ui/public/android-chrome-192x192.png
          dependencies:
            - postgresql
          template: PREBUILT_V2
          spec:
            id: paperclip
            source:
                image: ghcr.io/paperclipai/paperclip:sha-911a1e8
                command:
                    - /bin/sh
                    - -c
                    - /opt/paperclip/init.sh
            ports:
                - id: web
                  port: 3100
                  type: HTTP
            volumes:
                - id: paperclip
                  dir: /paperclip
            env:
                BETTER_AUTH_BASE_URL:
                    default: ${ZEABUR_WEB_URL}
                BETTER_AUTH_SECRET:
                    default: ${PASSWORD}
                DATABASE_URL:
                    default: ${POSTGRES_CONNECTION_STRING}
                PAPERCLIP_AGENT_JWT_SECRET:
                    default: ${PASSWORD}
                PAPERCLIP_AUTH_DISABLE_SIGN_UP:
                    default: "false"
                PAPERCLIP_MIGRATION_AUTO_APPLY:
                    default: "true"
                PAPERCLIP_PUBLIC_URL:
                    default: ${ZEABUR_WEB_URL}
            configs:
                - path: /opt/paperclip/init.sh
                  template: |
                    #!/bin/sh
                    set -e
                    CONFIG="/paperclip/instances/default/config.json"
                    if [ ! -f "$CONFIG" ]; then
                      mkdir -p "$(dirname "$CONFIG")"
                      cat > "$CONFIG" <<'CONF'
                    { "$meta": { "version": 1, "updatedAt": "2026-01-01T00:00:00.000Z", "source": "onboard" }, "database": { "mode": "postgres" }, "logging": { "mode": "file" }, "server": { "deploymentMode": "authenticated", "exposure": "private", "host": "0.0.0.0", "port": 3100, "serveUi": true } }
                    CONF
                      echo "Generated $CONFIG"
                    fi
                    exec docker-entrypoint.sh node --import ./server/node_modules/tsx/dist/loader.mjs server/dist/index.js
                  permission: 493
                  envsubst: null
          domainKey: PUBLIC_DOMAIN
localization:
    es-ES:
        description: |
            Plataforma de orquestación para coordinar múltiples agentes de IA para operar negocios autónomos. Gestiona equipos de agentes, asigna objetivos, rastrea trabajo y monitorea costos desde un panel centralizado.
        variables:
            - key: PUBLIC_DOMAIN
              type: STRING
              name: Dominio
              description: El dominio para acceder al panel de Paperclip
        readme: |
            # Paperclip

            > **Beta:** Paperclip está en desarrollo temprano. Esta plantilla y el software pueden presentar problemas inesperados.

            [Paperclip](https://github.com/paperclipai/paperclip) es una plataforma de orquestación para coordinar múltiples agentes de IA (Claude, Codex, Cursor, OpenClaw, etc.) para operar negocios autónomos. Proporciona un servidor Node.js con una interfaz React para gestionar equipos de agentes, asignar objetivos, rastrear trabajo y monitorear costos.

            ## Primeros pasos

            1. Despliegue la plantilla y espere a que el servicio se inicie.
            2. Abra el dominio de Paperclip desde la pestaña **Networking** de Zeabur.
            3. Haga clic en **Sign in / Create account** y regístrese con su correo electrónico y contraseña. El primer usuario en registrarse se convierte automáticamente en administrador de la instancia.
            5. Después de la configuración, establezca `PAPERCLIP_AUTH_DISABLE_SIGN_UP` en `true` en las variables de entorno de Zeabur para evitar registros no autorizados.
            6. Configure la autenticación de agentes IA (consulte **Autenticación de agentes IA** más abajo).
            7. Al crear un agente, establezca **Working directory** en una ruta bajo `/paperclip/` (ej. `/paperclip/workspaces/my-project`).
            8. Haga clic en **Test now** para ejecutar la verificación del adaptador. Un resultado exitoso muestra `hello probe succeeded`.

            > **Alternativa:** También puede crear el primer administrador desde el Terminal de Zeabur: `gosu node pnpm paperclipai auth bootstrap-ceo`

            ## Autenticación de agentes IA

            **Opción 1: Variables de entorno (recomendado)**

            Configure estas en las variables de entorno de Zeabur:

            | Herramienta | Variable de entorno |
            |-------------|---------------------|
            | Claude Code | `ANTHROPIC_API_KEY` |
            | Codex | `OPENAI_API_KEY` |

            **Opción 2: Login en Terminal**

            Abra el Terminal de Zeabur y ejecute:

            | Herramienta | Login en Terminal |
            |-------------|------------------|
            | Claude Code | `gosu node claude login` |
            | Codex | `gosu node codex login --device-auth` |

            ### Notas

            - **Use siempre el prefijo `gosu node`** al ejecutar herramientas CLI en el Terminal. El terminal se ejecuta como root, pero las credenciales deben almacenarse en el directorio del usuario `node` (`/paperclip/`) para persistir y ser accesibles por el servidor.
            - **Autenticación de dispositivo Codex:** Habilite "Enable device code authorization for Codex" en [ChatGPT Security Settings](https://chatgpt.com/settings/security) antes de ejecutar el comando de inicio de sesión.

            ## Notas importantes

            - **Almacenamiento persistente:** Solo los datos bajo `/paperclip/` sobreviven a los reinicios. Todas las demás rutas son efímeras.
            - **Directorio de trabajo:** No use `/app` — contiene el código fuente de Paperclip y se sobrescribirá en actualizaciones. Use siempre rutas bajo `/paperclip/` (persistente).
            - **Control de registro:** Establezca `PAPERCLIP_AUTH_DISABLE_SIGN_UP` en `true` después de crear su cuenta de administrador. Cambie temporalmente a `false` cuando necesite invitar nuevos usuarios, luego vuelva a `true`.

            ## Registro de cambios

            ### 2026-06-05 — v2026.529.0

            - Imagen actualizada a la versión upstream `v2026.529.0` (`ghcr.io/paperclipai/paperclip:sha-911a1e8`)
