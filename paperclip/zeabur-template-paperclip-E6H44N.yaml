            - Nuevo: Plugin de sandbox Modal (junto a E2B, Cloudflare, Daytona)
            - Nuevo: Plugin visor de diffs de workspace
            - Nuevo: Secrets en Routines con precedencia `agent < project < routine`
            - Nuevo: Sincronización Local Cloud Upstream
            - Nuevo: Acciones de recuperación con alcance de origen para trabajo estancado
            - Nuevo: Vista Blocked Inbox para triaje de tareas bloqueadas
            - Nuevo: Flujo de desarrollo local de plugins con `paperclipai plugin init`
            - Nuevo: Bloqueo de documentos para transferencias seguras entre agentes
            - Nuevo: Base de i18n (i18next, validación de locales)
            - Mejorado: Adaptador ACPX-Claude funciona sin configuración adicional
            - Mejorado: Permisos de agentes con alcance y controles de asignación
            - Mejorado: Escalabilidad Kanban con tarjetas compactas y columnas colapsables
            - Mejorado: Pausar/reanudar agentes desde el sidebar, hilos de chat virtualizados

            ### 2026-04-22 — v2026.416.0

            - Imagen actualizada a la versión upstream `v2026.416.0` (`ghcr.io/paperclipai/paperclip:sha-b8725c5`)
            - Nuevo: Sistema de plugins de adaptadores externos con parsers UI dinámicos y esquemas de configuración declarativos
            - Nuevo: Visualización de jerarquía de issues (contraer/expandir, conteo de subtareas, estado persistido)
            - Nuevo: Flujo de votación y captura con pulgar para evaluaciones
            - Nuevo: Espacios de trabajo de ejecución con controles de runtime y pestaña por proyecto
            - Nuevo: Ejecuciones de Routine conscientes del workspace
