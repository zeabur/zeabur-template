        readme: |
            # Paperclip

            > **测试版：** Paperclip 仍处于早期开发阶段。此模板和软件可能会有无法预期的问题。

            [Paperclip](https://github.com/paperclipai/paperclip) 是一个 AI 多代理协调平台，用于协调多个 AI 代理（Claude、Codex、Cursor、OpenClaw 等）自主运营业务。提供 Node.js 服务器搭配 React UI，管理代理团队、分配目标、追踪工作并监控成本。

            ## 开始使用

            1. 部署模板并等待服务启动。
            2. 从 Zeabur **Networking** 分页打开 Paperclip 域名。
            3. 点击 **Sign in / Create account**，使用邮箱和密码注册。第一位注册的用户会自动成为实例管理员。
            5. 设置完成后，将 Zeabur 环境变量 `PAPERCLIP_AUTH_DISABLE_SIGN_UP` 设为 `true` 以禁止未授权的注册。
            6. 配置 AI 代理认证（请参阅下方 **AI 代理认证**）。
            7. 建立代理时，将 **Working directory** 设置为 `/paperclip/` 下的路径（例如 `/paperclip/workspaces/my-project`）。
            8. 点击 **Test now** 执行适配器环境检查。成功结果会显示 `hello probe succeeded`。

            > **替代方式：** 也可以通过 Zeabur 命令创建第一个管理员：`gosu node pnpm paperclipai auth bootstrap-ceo`

            ## AI 代理认证

            **方式一：环境变量（推荐）**

            在 Zeabur 环境变量中设置：

            | 工具 | 环境变量 |
            |------|---------|
            | Claude Code | `ANTHROPIC_API_KEY` |
            | Codex | `OPENAI_API_KEY` |

            **方式二：命令登录**

            打开 Zeabur 命令并执行：

            | 工具 | 命令登录 |
            |------|--------|
            | Claude Code | `gosu node claude login` |
            | Codex | `gosu node codex login --device-auth` |

            ### 注意事项

            - **请务必使用 `gosu node` 前缀**执行命令中的 CLI 工具。命令以 root 运行，但凭据需存储在 `node` 用户主目录（`/paperclip/`）下以持久化并供服务器访问。
            - **Codex 设备验证：** 执行登录命令前，请先在 [ChatGPT Security Settings](https://chatgpt.com/settings/security) 中启用「Enable device code authorization for Codex」。

            ## 重要事项

            - **持久化存储：** 仅 `/paperclip/` 下的数据在重启后保留。其他路径均为临时存储。
            - **工作目录：** 请勿使用 `/app`——该路径包含 Paperclip 源代码，更新时会被覆盖。请使用 `/paperclip/` 下的路径（持久化）。
            - **注册管控：** 创建管理员账号后，将 `PAPERCLIP_AUTH_DISABLE_SIGN_UP` 设为 `true`。需要邀请新用户时暂时设为 `false`，完成后再改回 `true`。

