        readme: |
            # Paperclip

            > **Beta:** Paperclip masih dalam tahap pengembangan awal. Template ini dan perangkat lunaknya mungkin mengalami masalah yang tidak terduga.

            [Paperclip](https://github.com/paperclipai/paperclip) adalah platform orkestrasi untuk mengoordinasikan beberapa agen AI (Claude, Codex, Cursor, OpenClaw, dll.) untuk menjalankan bisnis otonom. Menyediakan server Node.js dengan UI React untuk mengelola tim agen, menetapkan tujuan, melacak pekerjaan, dan memantau biaya.

            ## Memulai

            1. Deploy template dan tunggu layanan dimulai.
            2. Buka domain Paperclip dari tab **Networking** di Zeabur.
            3. Klik **Sign in / Create account**, lalu daftar dengan email dan kata sandi Anda. Pengguna pertama yang mendaftar secara otomatis menjadi admin instance.
            5. Setelah selesai, atur `PAPERCLIP_AUTH_DISABLE_SIGN_UP` menjadi `true` di variabel lingkungan Zeabur untuk mencegah pendaftaran tidak sah.
            6. Konfigurasi autentikasi agen AI (lihat **Autentikasi Agen AI** di bawah).
            7. Saat membuat agen, atur **Working directory** ke path di bawah `/paperclip/` (contoh: `/paperclip/workspaces/my-project`).
            8. Klik **Test now** untuk menjalankan pemeriksaan adapter. Hasil sukses menampilkan `hello probe succeeded`.

            > **Alternatif:** Anda juga dapat membuat admin pertama melalui Terminal Zeabur: `gosu node pnpm paperclipai auth bootstrap-ceo`

            ## Autentikasi Agen AI

            **Opsi 1: Variabel lingkungan (disarankan)**

            Atur variabel berikut di variabel lingkungan Zeabur:

            | Alat | Variabel Lingkungan |
            |------|---------------------|
            | Claude Code | `ANTHROPIC_API_KEY` |
            | Codex | `OPENAI_API_KEY` |

            **Opsi 2: Login Terminal**

            Buka Terminal Zeabur dan jalankan:

            | Alat | Login Terminal |
            |------|----------------|
            | Claude Code | `gosu node claude login` |
            | Codex | `gosu node codex login --device-auth` |

            ### Catatan

            - **Selalu gunakan prefiks `gosu node`** saat menjalankan alat CLI di Terminal. Terminal berjalan sebagai root, tetapi kredensial harus disimpan di direktori pengguna `node` (`/paperclip/`) agar persisten dan dapat diakses oleh server.
            - **Autentikasi perangkat Codex:** Aktifkan "Enable device code authorization for Codex" di [ChatGPT Security Settings](https://chatgpt.com/settings/security) sebelum menjalankan perintah login.

            ## Catatan Penting

            - **Penyimpanan persisten:** Hanya data di bawah `/paperclip/` yang bertahan setelah restart. Semua path lainnya bersifat sementara.
            - **Direktori kerja:** Jangan gunakan `/app` — berisi kode sumber Paperclip dan akan ditimpa saat pembaruan. Selalu gunakan path di bawah `/paperclip/` (persisten).
            - **Kontrol pendaftaran:** Atur `PAPERCLIP_AUTH_DISABLE_SIGN_UP` menjadi `true` setelah membuat akun admin Anda. Ubah sementara ke `false` saat perlu mengundang pengguna baru, lalu kembalikan ke `true`.

            ## Catatan Perubahan

            ### 2026-06-05 — v2026.529.0

            - Image diperbarui ke rilis upstream `v2026.529.0` (`ghcr.io/paperclipai/paperclip:sha-911a1e8`)
            - Startup disederhanakan: init.sh kini mendelegasikan ke `docker-entrypoint.sh` bawaan image
