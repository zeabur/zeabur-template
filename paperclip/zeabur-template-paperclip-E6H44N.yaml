    ja-JP:
        description: |
            複数のAIエージェントを協調して自律的なビジネスを運営するためのオーケストレーションプラットフォーム。エージェントチームの管理、目標の割り当て、作業の追跡、コスト監視を一元的なダッシュボードから行えます。
        variables:
            - key: PUBLIC_DOMAIN
              type: STRING
              name: ドメイン
              description: Paperclipダッシュボードにアクセスするためのドメイン
        readme: |
            # Paperclip

            > **ベータ版：** Paperclip は初期開発段階です。このテンプレートとソフトウェアには予期しない問題が発生する可能性があります。

            [Paperclip](https://github.com/paperclipai/paperclip) は、複数のAIエージェント（Claude、Codex、Cursor、OpenClawなど）を協調して自律的なビジネスを運営するためのオーケストレーションプラットフォームです。Node.jsサーバーとReact UIを提供し、エージェントチームの管理、目標の割り当て、作業の追跡、コストの監視を行います。

            ## はじめに

            1. テンプレートをデプロイし、サービスの起動を待ちます。
            2. Zeabur の **Networking** タブから Paperclip のドメインを開きます。
            3. **Sign in / Create account** をクリックし、メールアドレスとパスワードでサインアップします。最初にサインアップしたユーザーが自動的にインスタンス管理者になります。
            5. セットアップ完了後、Zeabur環境変数の `PAPERCLIP_AUTH_DISABLE_SIGN_UP` を `true` に設定し、不正な登録を防止します。
            6. AIエージェント認証を設定します（下記の **AIエージェント認証** を参照）。
            7. エージェント作成時、**Working directory** を `/paperclip/` 配下のパスに設定します（例：`/paperclip/workspaces/my-project`）。
            8. **Test now** をクリックしてアダプター環境チェックを実行します。成功すると `hello probe succeeded` と表示されます。

            > **代替方法：** Zeabur ターミナルから最初の管理者を作成することもできます：`gosu node pnpm paperclipai auth bootstrap-ceo`

            ## AIエージェント認証

            **方法1：環境変数（推奨）**

            Zeabur の環境変数に以下を設定します：

            | ツール | 環境変数 |
            |--------|---------|
            | Claude Code | `ANTHROPIC_API_KEY` |
            | Codex | `OPENAI_API_KEY` |

            **方法2：ターミナルログイン**

            Zeabur ターミナルを開き、以下を実行します：

            | ツール | ターミナルログイン |
            |--------|----------------|
            | Claude Code | `gosu node claude login` |
            | Codex | `gosu node codex login --device-auth` |

            ### 注意事項

            - **ターミナルで CLIツールを実行する際は必ず `gosu node` プレフィックスを使用してください。** ターミナルはrootで実行されますが、認証情報は `node` ユーザーのホーム（`/paperclip/`）に保存される必要があります。
            - **Codexデバイス認証：** ログインコマンドを実行する前に、[ChatGPT Security Settings](https://chatgpt.com/settings/security) で「Enable device code authorization for Codex」を有効にしてください。

            ## 重要事項

            - **永続ストレージ：** `/paperclip/` 配下のデータのみ再起動後も保持されます。その他のパスは一時的です。
            - **作業ディレクトリ：** `/app` は使用しないでください。Paperclipのソースコードが含まれており、更新時に上書きされます。必ず `/paperclip/` 配下のパス（永続化）を使用してください。
            - **登録制御：** 管理者アカウント作成後、`PAPERCLIP_AUTH_DISABLE_SIGN_UP` を `true` に設定してください。新しいユーザーを招待する際は一時的に `false` に変更し、完了後 `true` に戻してください。

            ## 変更履歴

            ### 2026-06-05 — v2026.529.0

            - イメージをアップストリームリリース `v2026.529.0` に更新（`ghcr.io/paperclipai/paperclip:sha-911a1e8`）
            - 起動を簡素化：init.sh がイメージのネイティブ `docker-entrypoint.sh` に委譲するように変更
            - 新機能：**ブラウザベースの初回管理者クレーム** — ターミナル不要で初回管理者を設定可能
            - 新機能：インラインドキュメントアノテーションとリビジョン対応コメントスレッド
            - 新機能：カンパニースキルCLIとカタログ管理
            - 新機能：サイドバーからプロジェクトとエージェントを非表示（ユーザー単位のリソースメンバーシップ）
            - 新機能：Claude モデルのライブ検出
            - 新機能：Grok Build をファーストクラスのローカルランタイムとして追加
            - 新機能：Modal サンドボックスプロバイダープラグイン（E2B、Cloudflare、Daytonaと併用）
            - 新機能：ワークスペース差分ビューアープラグイン
            - 新機能：Routine シークレット（`agent < project < routine` 優先順位）
            - 新機能：ローカル Cloud Upstream 同期
            - 新機能：停滞した作業のソーススコープ復旧アクション
            - 新機能：ブロックされたタスクのトリアージ用 Blocked Inbox ビュー
            - 新機能：`paperclipai plugin init` によるローカルプラグイン開発ワークフロー
            - 新機能：安全なエージェント引き継ぎのためのドキュメントロック
            - 新機能：i18n 基盤（i18next、ロケール検証）
            - 改善：ACPX-Claude アダプターが追加設定なしで動作
            - 改善：スコープ付きエージェント権限と割り当て制御
            - 改善：コンパクトカードと折りたたみ可能なカラムによる Kanban スケーリング
            - 改善：サイドバーからのエージェント一時停止/再開、仮想化チャットスレッド

            ### 2026-04-22 — v2026.416.0

            - イメージをアップストリームリリース `v2026.416.0` に更新（`ghcr.io/paperclipai/paperclip:sha-b8725c5`）
            - 新機能：動的UIパーサーと宣言的設定スキーマを備えた外部アダプタープラグインシステム
            - 新機能：Issue階層表示（折りたたみ/展開、サブタスク数、状態の永続化）
            - 新機能：評価用のフィードバック投票・サムズキャプチャフロー
            - 新機能：実行ワークスペース（ランタイム制御、プロジェクト単位のワークスペースタブ）
            - 新機能：ワークスペース対応のRoutine実行
            - 改善：受信トレイのメールクライアント風キーボードショートカット、「今日」区切り線
            - 改善：モバイルレイアウト、ダークモード、アダプターオーバーライドUI
            - セキュリティ：`BETTER_AUTH_SECRET` と `PAPERCLIP_AGENT_JWT_SECRET` が起動時に必須となりました（本テンプレートは既に設定済み）

            ### 2026-04-07 — v2026.403.0

            - イメージをアップストリームリリース `v2026.403.0` に更新（`ghcr.io/paperclipai/paperclip:sha-a072377`）
            - Docker Hub（`zeabur/paperclip`）から上流のGitHub Container Registry（`ghcr.io/paperclipai/paperclip`）に切り替え
            - 永続ボリュームのパスを `/home/node/` から `/paperclip/` に変更
            - CLIコマンドのプレフィックスを `runuser -u node --` から `gosu node` に変更
            - 新機能：ファーストクラスのブロッカー/依存関係、サブタスク完了時の自動起動付き
            - 改善：サーバーログ内のBearerトークンの秘匿化
            - 改善：CEOエージェントのオンボーディングを相対パス化
            - 改善：インラインエディタでのmarkdown貼り付けの自動フォーマット
            - UIルーティング、サイドバー、worktree、エージェントフローに関する複数のバグ修正

            ### 2026-03-30 — v2026.325.0

            - イメージをアップストリームリリース `v2026.325.0` に更新（v0.3.1以降652コミット）
            - 新機能：受信トレイ「マイ」タブとアーカイブフロー
