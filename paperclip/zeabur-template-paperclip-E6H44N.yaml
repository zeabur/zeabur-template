            - Baru: Plugin sandbox Modal (bersama E2B, Cloudflare, Daytona)
            - Baru: Plugin penampil diff workspace
            - Baru: Secrets di Routine dengan prioritas `agent < project < routine`
            - Baru: Sinkronisasi Local Cloud Upstream
            - Baru: Aksi pemulihan bercakupan sumber untuk pekerjaan terhenti
            - Baru: Tampilan Blocked Inbox untuk triase tugas terblokir
            - Baru: Alur pengembangan plugin lokal dengan `paperclipai plugin init`
            - Baru: Penguncian dokumen untuk serah terima agen yang lebih aman
            - Baru: Fondasi i18n (i18next, validasi locale)
            - Ditingkatkan: Adaptor ACPX-Claude berfungsi langsung tanpa konfigurasi tambahan
            - Ditingkatkan: Izin agen bercakupan dan kontrol penugasan
            - Ditingkatkan: Skalabilitas Kanban dengan kartu kompak dan kolom yang dapat diciutkan
            - Ditingkatkan: Jeda/lanjutkan agen dari sidebar, thread chat tervirtualisasi

            ### 2026-04-22 — v2026.416.0

            - Image diperbarui ke rilis upstream `v2026.416.0` (`ghcr.io/paperclipai/paperclip:sha-b8725c5`)
            - Baru: Sistem plugin adaptor eksternal dengan parser UI dinamis dan skema konfigurasi deklaratif
            - Baru: Tampilan hierarki issue (ciutkan/perluas, jumlah sub-tugas, status persisten)
            - Baru: Alur voting umpan balik dan jempol untuk evaluasi
