      | **TTS**（文字转语音）| Microsoft Edge-TTS | 免费、不需 key |
      | **Live2D** | 浏览器渲染 | 免费 |

      ## 快速开始

      1. **获取 LLM API key** — 用任一 OpenAI 兼容供应商（OpenAI、Anthropic、Google Gemini、DeepSeek、Groq…）。按你的供应商设置 `LLM_API_KEY`、`LLM_BASE_URL`、`LLM_MODEL` — 见下方表格。
