        name: LLM Base URL
        description: あなたのプロバイダーの OpenAI 互換 API base URL。OpenAI は https://api.openai.com/v1、Anthropic は https://api.anthropic.com/v1（Claude キーが必要）。その他のプロバイダーは readme の表を参照してください。
      - key: LLM_MODEL
        name: LLM モデル
        description: あなたのプロバイダーのモデル名。例 — OpenAI gpt-4o-mini；Anthropic claude-haiku-4-5；Gemini gemini-2.5-flash；DeepSeek deepseek-chat。
