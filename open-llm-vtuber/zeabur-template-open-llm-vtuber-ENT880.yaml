        name: LLM API キー（必須）
        description: あなた自身の OpenAI 互換 LLM プロバイダーの API キー（OpenAI、Anthropic、Gemini、DeepSeek、Groq など）。LLM_BASE_URL と LLM_MODEL と一緒に設定してください。キーが未設定の場合、LLM は設定されず対話は機能しません。
