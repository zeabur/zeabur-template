  ja-JP:
    description: |
      成長するチームのための最速のナレッジベース。セルフホスト可能なオープンソースの Wiki・ドキュメントツールで、リアルタイム共同編集と Markdown に対応。
    variables:
      - key: PUBLIC_DOMAIN
        name: ドメイン
        description: どのドメインをバインドしますか？
    readme: |
      # Outline

      [Outline](https://www.getoutline.com) は高速で共同編集可能なオープンソースのナレッジベース・Wiki です。このテンプレートは PostgreSQL と Redis も併せてデプロイし、**ローカルファイルストレージ**を使用します（S3/MinIO は不要）。

      ## ⚠️ 認証プロバイダー（SSO）の設定が必須です

      Outline に**ユーザー名／パスワードログインはありません**。SSO（OIDC、Google、Slack、GitHub など）でのみログインできます。Email マジックリンクは既存ユーザーのみ有効なため、**最初の管理者アカウントは必ず SSO で作成**する必要があります。デプロイ後、`outline` サービスに以下のいずれかを設定して再起動してください：

      > 💡 **最初にログインした人が自動的に管理者になります** —— 別途の管理者設定はありません。自分が最初にログインするようにしてください。

      ### オプション A — 汎用 OIDC（Authentik / Logto / Keycloak / Zitadel…）
      `outline` サービスに設定：
      - `OIDC_CLIENT_ID`
      - `OIDC_CLIENT_SECRET`
      - `OIDC_AUTH_URI`
      - `OIDC_TOKEN_URI`
      - `OIDC_USERINFO_URI`

      コールバック URL：`https://あなたのドメイン/auth/oidc.callback`

      ### オプション B — Google
      Google Cloud Console で OAuth クライアントを作成し設定：
      - `GOOGLE_CLIENT_ID`
      - `GOOGLE_CLIENT_SECRET`

      コールバック URL：`https://あなたのドメイン/auth/google.callback`

      ## 注意事項

      - `SECRET_KEY` と `UTILS_SECRET` は初回起動時に自動生成されデータボリュームに保存されます。変更すると既存の暗号化データが読めなくなるため変更しないでください。
      - Email 招待を有効にするには `SMTP_*` を設定してください。
      - アップロードファイルは永続ボリューム `/var/lib/outline/data` に保存されます。

      ## リンクとライセンス

      - 公式サイト：https://www.getoutline.com
      - ソース：https://github.com/outline/outline
      - ライセンス：[BSL 1.1](https://github.com/outline/outline/blob/main/LICENSE) — このテンプレートは公式 `outlinewiki/outline` イメージを Zeabur 用にパッケージするものです。

  es-ES:
    description: |
      La base de conocimiento más rápida para equipos en crecimiento. Una wiki y herramienta de documentación autoalojada y de código abierto, con colaboración en tiempo real y compatibilidad con Markdown.
    variables:
      - key: PUBLIC_DOMAIN
        name: Dominio
        description: ¿Qué dominio quieres vincular?
    readme: |
      # Outline

      [Outline](https://www.getoutline.com) es una base de conocimiento y wiki de código abierto, rápida y colaborativa. Esta plantilla despliega Outline junto con PostgreSQL y Redis, usando **almacenamiento local de archivos** (no requiere S3/MinIO).

      ## ⚠️ Debes configurar un proveedor de autenticación (SSO)

      Outline **no tiene inicio de sesión con usuario y contraseña**. Solo funciona mediante SSO (OIDC, Google, Slack, GitHub, etc.). El enlace mágico por correo solo funciona para usuarios ya existentes, por lo que **la primera cuenta de administrador debe crearse vía SSO**. Tras el despliegue, configura una de estas opciones en el servicio `outline` y reinícialo:

      > 💡 **La primera persona que inicie sesión se convierte automáticamente en administrador** — no hay una configuración de administrador aparte. Solo asegúrate de ser el primero en iniciar sesión.

      ### Opción A — OIDC genérico (Authentik / Logto / Keycloak / Zitadel…)
      Configura en el servicio `outline`:
      - `OIDC_CLIENT_ID`
      - `OIDC_CLIENT_SECRET`
      - `OIDC_AUTH_URI`
      - `OIDC_TOKEN_URI`
      - `OIDC_USERINFO_URI`

      URL de redirección: `https://TU_DOMINIO/auth/oidc.callback`

      ### Opción B — Google
      Crea un cliente OAuth en Google Cloud Console y configura:
      - `GOOGLE_CLIENT_ID`
      - `GOOGLE_CLIENT_SECRET`

      URL de redirección: `https://TU_DOMINIO/auth/google.callback`

      ## Notas

      - `SECRET_KEY` y `UTILS_SECRET` se generan automáticamente en el primer arranque y se guardan en el volumen de datos; no los cambies o los datos cifrados existentes quedarán ilegibles.
      - Para habilitar invitaciones por correo, configura las variables `SMTP_*`.
      - Los archivos subidos se almacenan en el volumen persistente `/var/lib/outline/data`.

      ## Enlaces y licencia

      - Sitio web: https://www.getoutline.com
      - Código fuente: https://github.com/outline/outline
      - Licencia: [BSL 1.1](https://github.com/outline/outline/blob/main/LICENSE) — esta plantilla solo empaqueta la imagen oficial `outlinewiki/outline` para Zeabur.

  id-ID:
    description: |
      Basis pengetahuan tercepat untuk tim yang berkembang. Wiki dan alat dokumentasi open-source yang bisa dihosting sendiri, dengan kolaborasi real-time dan dukungan Markdown.
    variables:
      - key: PUBLIC_DOMAIN
        name: Domain
        description: Domain mana yang ingin Anda hubungkan?
    readme: |
      # Outline

      [Outline](https://www.getoutline.com) adalah basis pengetahuan dan wiki open-source yang cepat dan kolaboratif. Template ini men-deploy Outline bersama PostgreSQL dan Redis, menggunakan **penyimpanan file lokal** (tidak perlu S3/MinIO).

      ## ⚠️ Anda harus mengonfigurasi penyedia autentikasi (SSO)

      Outline **tidak memiliki login username/password**. Login hanya bisa melalui SSO (OIDC, Google, Slack, GitHub, dll). Magic link email hanya berlaku untuk pengguna yang sudah ada, jadi **akun admin pertama harus dibuat via SSO**. Setelah deploy, atur salah satu opsi berikut pada service `outline` lalu restart:

      > 💡 **Orang pertama yang login otomatis menjadi administrator** — tidak ada langkah pengaturan admin terpisah. Pastikan saja Anda yang pertama login.

      ### Opsi A — OIDC umum (Authentik / Logto / Keycloak / Zitadel…)
      Atur pada service `outline`:
      - `OIDC_CLIENT_ID`
      - `OIDC_CLIENT_SECRET`
      - `OIDC_AUTH_URI`
      - `OIDC_TOKEN_URI`
      - `OIDC_USERINFO_URI`

      URL callback: `https://DOMAIN_ANDA/auth/oidc.callback`

      ### Opsi B — Google
      Buat OAuth client di Google Cloud Console lalu atur:
      - `GOOGLE_CLIENT_ID`
      - `GOOGLE_CLIENT_SECRET`

      URL callback: `https://DOMAIN_ANDA/auth/google.callback`

      ## Catatan

      - `SECRET_KEY` dan `UTILS_SECRET` dibuat otomatis saat pertama kali boot dan disimpan ke volume data — jangan diubah atau data terenkripsi yang ada tidak bisa dibaca.
      - Untuk mengaktifkan undangan email, konfigurasikan variabel `SMTP_*`.
      - File unggahan disimpan di volume persisten `/var/lib/outline/data`.

      ## Tautan & Lisensi

      - Situs web: https://www.getoutline.com
      - Sumber: https://github.com/outline/outline
      - Lisensi: [BSL 1.1](https://github.com/outline/outline/blob/main/LICENSE) — template ini hanya mengemas image resmi `outlinewiki/outline` untuk Zeabur.
